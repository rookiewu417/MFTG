[workspace]
name = "ml-factor-report-reproduction"
channels = ["conda-forge"]
channel-priority = "strict"
platforms = ["linux-64"]
[dependencies]
python = "3.12.*"
numpy = ">=1.26,<3"
pandas = ">=2.2,<3"
pyarrow = ">=16,<22"
polars = ">=1.0,<2"
scipy = ">=1.12,<2"
pytorch = ">=2.3,<3"
[tasks]
metadata = "python reproduce.py metadata"
prepare = "python reproduce.py prepare"
train = "python reproduce.py train"
evaluate = "python reproduce.py evaluate"

